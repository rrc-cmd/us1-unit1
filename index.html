ext:<\/b> British troops had been stationed in Boston since <b>1768<\/b> to enforce the <b>Townshend Acts<\/b> and control the boycotts and harassment of tax collectors. Soldiers competed with local workers for jobs, and fights in the streets were common.<\/p>\n<p><b>The event:<\/b> On <b>March 5, 1770<\/b>, a crowd gathered around a British sentry on <b>King Street<\/b>. People shouted insults and threw snowballs, ice, and sticks. A small group of soldiers under <b>Captain Thomas Preston<\/b> came to help. In the confusion, the soldiers <b>fired into the crowd<\/b>, killing <b>five colonists<\/b>, including <b>Crispus Attucks<\/b>, a man of African and Native American descent.<\/p>\n<p><b>What happened next:<\/b><\/p>\n<ul><li><b>Patriot leaders<\/b> like Samuel Adams and Paul Revere used it as <b>propaganda<\/b> — proof of British brutality.<\/li>\n<li><b>John Adams<\/b>, a Patriot lawyer, agreed to <b>defend the British soldiers in court<\/b>. Most were found not guilty; two were convicted of the lesser crime of manslaughter.<\/li>\n<li>That same month, Parliament had repealed the Townshend Acts (except for tea).<\/li><\/ul>\n<div class=\"why\"><b>Why it matters:<\/b> The event itself was probably confusion and panic on both sides. But how it was <b>portrayed<\/b> turned colonial opinion further against Britain. That's why your class looks at the sources, not just the facts.<\/div>\n", "check": {"q": "What is the best description of the historical context of the Boston Massacre?", "c": ["British troops were stationed in Boston to enforce the Townshend Acts, causing tension with residents", "The Declaration of Independence had just been signed", "Britain had just closed the port of Boston", "The French & Indian War was being fought in Boston"], "a": 0, "e": "Troops arrived in 1768 because of the Townshend Act protests. Job competition and street clashes followed."}}, {"title": "Source 2: Paul Revere's engraving", "when": "~3 weeks after the event", "html": "\n<figure class=\"fig\"><img data-img=\"revere\" alt=\"Paul Revere's engraving The Bloody Massacre in King Street, showing a straight line of British soldiers firing on colonists\"><figcaption>Paul Revere, \"The Bloody Massacre in King-Street, March 5, 1770\" (1770)<\/figcaption><\/figure>\n<p>Look at the details Revere chose:<\/p>\n<ul>\n<li>The soldiers stand in a <b>neat, straight line<\/b>, firing <b>together<\/b>, like an organized execution.<\/li>\n<li>An officer (on the right) appears to be <b>ordering them to fire<\/b>.<\/li>\n<li>The colonists look <b>calm, unarmed, and defenseless<\/b> — no snowballs, no clubs. Several lie bleeding.<\/li>\n<li>The building behind the soldiers is labeled <b>\"Butcher's Hall.\"<\/b><\/li>\n<li>The title calls it <b>\"The Bloody Massacre\"<\/b> and the poem calls the soldiers a \"savage Band\" and \"fierce Barbarians.\"<\/li>\n<\/ul>\n<table class=\"tbl\"><tr><th>Question<\/th><th>Answer<\/th><\/tr>\n<tr><td>Colonists: victims or aggressors?<\/td><td><b>Victims<\/b> — peaceful, unarmed, being shot down.<\/td><\/tr>\n<tr><td>British soldiers: victims or aggressors?<\/td><td><b>Aggressors<\/b> — lined up, firing deliberately on command, \"Butcher's Hall.\"<\/td><\/tr>\n<tr><td>Historical context<\/td><td>British troops stationed in Boston to enforce the Townshend Acts; rising tension and boycotts.<\/td><\/tr>\n<tr><td>Artist's point of view<\/td><td>Revere was a Boston silversmith and a <b>Patriot / Son of Liberty<\/b> who opposed British policies and troops in Boston.<\/td><\/tr><\/table>\n<div class=\"why\"><b>POV vs. argument:<\/b> Your chart says \"point of view (NOT argument).\" POV = <i>who Revere was and where he stood<\/i> (a Patriot, Son of Liberty). The argument would be <i>what he wanted you to believe<\/i> (the British are murderers). Don't mix them up.<\/div>\n<p>This is <b>propaganda<\/b>: information shaped to persuade people toward a cause. Revere made it about three weeks after the event and it spread through the colonies.<\/p>\n", "check": {"q": "Which detail in Revere's engraving best shows the British as aggressors?", "c": ["A dog stands in the street", "The soldiers stand in a straight line firing together as an officer signals", "Buildings line both sides of the street", "The sky is blue with a crescent moon"], "a": 1, "e": "The orderly line and the officer's command make it look deliberate, not like panic."}}, {"title": "Source 1: John Adams (HBO, 2008)", "when": "Secondary source", "html": "\n<p>Source 1 is Episode 1, <i>\"Join, or Die,\"<\/i> of the HBO series <i>John Adams<\/i> (2008). It's a <b>secondary source<\/b> — a dramatization made more than 200 years later.<\/p>\n<p><b>Why does John Adams take the case?<\/b> He believes <b>everyone deserves a fair trial<\/b> and a defense, even unpopular British soldiers. He believes in the <b>rule of law<\/b> — if the colonists want to claim their rights as Englishmen, they must show they are a people of justice, not a mob.<\/p>\n<p><b>How the show portrays each side:<\/b> Compared with Revere, it shows a messier scene — an <b>angry, threatening crowd<\/b> and frightened soldiers. The colonists come across more as <b>aggressors<\/b> (or at least partly responsible), and the soldiers more as <b>victims of confusion and panic<\/b>. This matches your timeline reading, which called it \"almost certainly the result of confusion and panic by all involved.\"<\/p>\n<p><b>The tarring and feathering scene:<\/b><\/p>\n<ul><li>The crowd is <b>excited, angry, and out of control<\/b> — a mob enjoying the punishment.<\/li>\n<li>John Adams is <b>upset with his cousin Sam Adams<\/b> because Sam encourages or tolerates this <b>mob violence<\/b>. John believes it's cruel, lawless, and hurts the Patriot cause.<\/li>\n<li><b>Sources of power shown:<\/b> the power of the <b>crowd / mob<\/b> and groups like the Sons of Liberty (intimidation and violence — like forcing stamp distributors to resign), versus the power of <b>law and the courts<\/b> that John Adams stands for, and the <b>British government's<\/b> authority represented by tax and customs officials.<\/li><\/ul>\n<table class=\"tbl\"><tr><th>Question<\/th><th>Answer<\/th><\/tr>\n<tr><td>Colonists<\/td><td>More as <b>aggressors<\/b> — an angry crowd provoking the soldiers.<\/td><\/tr>\n<tr><td>British soldiers<\/td><td>More as <b>victims<\/b> — frightened, outnumbered, firing in panic.<\/td><\/tr>\n<tr><td>Historical context<\/td><td>Troops in Boston to enforce the Townshend Acts; trial of the soldiers afterward.<\/td><\/tr>\n<tr><td>Point of view<\/td><td>Told from the view of <b>John Adams<\/b>, a lawyer committed to the rule of law; made by modern filmmakers (2008) looking back.<\/td><\/tr><\/table>\n<p class=\"muted\">Scene details are summarized generally — check them against your notes from the video.<\/p>\n", "check": {"q": "Why does John Adams agree to defend the British soldiers?", "c": ["The king paid him to take the case", "He wants the soldiers to be found guilty", "He believes everyone deserves a fair trial and in the rule of law", "He is secretly a Loyalist"], "a": 2, "e": "Adams wanted to show the colonies respected justice and law, even for their enemies."}}, {"title": "Comparing the two sources", "when": "Skill wrap-up", "html": "\n<div class=\"compare\"><div><b>Revere (1770)<\/b><br>Primary source<br>Patriot / Son of Liberty<br>Colonists = victims<br>Soldiers = aggressors<br>Purpose: stir anger (propaganda)<\/div>\n<div><b>HBO John Adams (2008)<\/b><br>Secondary source<br>Adams's lawyer's view; modern filmmakers<br>Colonists = more aggressive<br>Soldiers = more like victims<br>Purpose: tell Adams's story, show rule of law<\/div><\/div>\n<p><b>Big lesson:<\/b> Two sources can describe the same event in opposite ways. To judge a source, always ask: <b>Who made it? When? Why? For whom?<\/b> That's POV, context, purpose, and audience.<\/p>\n<p><b>Primary vs. secondary:<\/b> A <b>primary source<\/b> is created at the time by someone who lived through it (Revere's engraving, the Stamp Act Congress resolutions, the Declaration). A <b>secondary source<\/b> is created later by someone interpreting the past (the HBO series, your textbook).<\/p>\n", "check": {"q": "Revere's engraving is considered propaganda because it", "c": ["was ordered by King George III", "was created 200 years after the event", "was designed to persuade viewers that the British were brutal, using selective and exaggerated details", "shows both sides fairly"], "a": 2, "e": "Propaganda shapes information to push people toward a cause. Revere left out the crowd's provocation."}}], "quiz": [{"q": "Which statement about Paul Revere's point of view is most accurate?", "c": ["He was a neutral reporter with no opinion", "He was a Loyalist who supported the soldiers", "He was a Patriot and Son of Liberty who opposed British troops in Boston", "He was a British officer who witnessed the event"], "a": 2, "e": "Revere's POV comes from his position as a Boston Patriot and member of the Sons of Liberty."}, {"q": "Which source is a SECONDARY source about the Boston Massacre?", "c": ["Paul Revere's 1770 engraving", "The 2008 HBO series John Adams", "Court records from the soldiers' 1770 trial", "A letter written by a Boston resident in March 1770"], "a": 1, "e": "The HBO series was created long after the event by people interpreting it."}, {"q": "The reading describes the Boston Massacre as 'almost certainly the result of confusion and panic.' Why, then, was it called a 'massacre'?", "c": ["The king ordered the soldiers to fire", "Colonial leaders publicized it as a symbol of British oppression", "Parliament officially named it that", "Hundreds of colonists were killed"], "a": 1, "e": "Five were killed. Patriot leaders chose the word 'massacre' to shape public opinion."}, {"q": "In the tarring and feathering scene, what source of power is shown by the crowd?", "c": ["The power of mob intimidation and violence", "The power of the king to declare war", "The power of Parliament to pass taxes", "The power of the courts to protect rights"], "a": 0, "e": "The crowd (encouraged by radicals like the Sons of Liberty) uses fear and violence as power."}, {"q": "Revere's engraving and the HBO series differ mainly in", "c": ["whether any colonists died", "the year they say the event took place", "the city where it happened", "who they portray as the victims and aggressors"], "a": 3, "e": "Revere shows peaceful victims and brutal soldiers; the series shows a threatening crowd and panicked soldiers."}], "flag": ""}, {"id": "s7", "num": 7, "title": "The Revolutionary War & Its Impact", "years": "1775–1783", "color": "#5fb8a8", "source": "The Revolutionary War: Animated Battle Map Video Questions", "intro": "This section follows the battle map video from Lexington to Yorktown, then covers the last key term: the impact of the American Revolution.", "lessons": [{"title": "1775–1776: the war begins, France watches", "when": "1775–1776", "html": "\n<p><b>Quick recap from Section 4:<\/b> Minutemen ambushed the British from cover at <b>Lexington and Concord<\/b> and the Americans won. At <b>Bunker Hill<\/b>, the British took the hill but lost over 1,000 men — Americans gained confidence, the British saw a long costly war ahead, and American leaders saw they needed a real army.<\/p>\n<p>The <b>Second Continental Congress created the Continental Army<\/b> and appointed <b>George Washington<\/b> to lead it.<\/p>\n<p>In <b>January 1776<\/b>, Washington ordered Thomas Paine's <i>Common Sense<\/i>, which advocates <b>independence<\/b>, to be <b>read aloud to his soldiers<\/b> in order to <b>inspire them and boost morale<\/b>.<\/p>\n<p><b>France:<\/b> In early 1776, France began to <b>secretly send money, weapons, and supplies<\/b> to the Americans. France had lost the French & Indian War to Britain and wanted revenge on its rival.<\/p>\n<p><b>What did the Declaration of Independence signal to France?<\/b> That the Americans were <b>fully committed to independence<\/b> — not just a protest that might end with reconciliation. That made them worth supporting against Britain.<\/p>\n", "check": {"q": "Why did France begin secretly helping the Americans?", "c": ["The colonists had promised France the Ohio Valley", "France wanted to take over the thirteen colonies", "King George asked France to help", "France wanted to weaken Britain, its rival, after losing the French & Indian War"], "a": 3, "e": "France saw a chance to hurt the rival that had beaten it in 1763."}}, {"title": "Dark days and the crossing of the Delaware", "when": "Late 1776", "html": "\n<p>After losing New York City, the Americans lost the battles at <b>Fort Washington and Fort Lee<\/b> (November 1776). The Continental Army was reduced to <b>only a few thousand men<\/b>, <b>poorly supplied and discouraged<\/b>, with most <b>enlistments set to expire at the end of the year<\/b>. The cause looked close to collapse.<\/p>\n<p><b>Retreat:<\/b> Washington and the Continental Army <b>retreated across New Jersey into Pennsylvania<\/b>.<\/p>\n<p><b>Christmas night, 1776:<\/b> Washington <b>crossed the Delaware River<\/b> and launched a <b>surprise attack<\/b> on <b>Hessian<\/b> troops (German soldiers hired by Britain) at <b>Trenton, New Jersey<\/b>. He won, then won again at Princeton days later.<\/p>\n<div class=\"why\"><b>Why it matters:<\/b> These small victories <b>saved the army's morale<\/b> and convinced soldiers to re-enlist right when the war might have ended.<\/div>\n", "check": {"q": "On Christmas night 1776, Washington crossed the Delaware River to", "c": ["surrender to General Cornwallis", "retreat to Valley Forge", "meet the French navy", "launch a surprise attack on Hessian troops at Trenton"], "a": 3, "e": "The surprise attack at Trenton gave the struggling army a desperately needed win."}}, {"title": "Saratoga and Baron von Steuben", "when": "1777–1778", "html": "\n<p><b>Battle of Saratoga (October 1777, New York):<\/b> American forces surrounded and forced British General <b>John Burgoyne<\/b> to <b>surrender his entire army<\/b>.<\/p>\n<p><b>Why it was significant:<\/b> Saratoga was the <b>turning point<\/b> of the war. It proved the Americans could defeat a major British army, and it <b>convinced France to formally ally with the United States<\/b> (1778), sending troops, money, and its navy.<\/p>\n<div class=\"chain\"><span>Declaration (committed to independence)<\/span><span>Victory at Saratoga (can actually win)<\/span><span>French alliance, 1778<\/span><\/div>\n<p><b>Baron von Steuben<\/b> was a <b>Prussian (German) military officer<\/b> who joined Washington at <b>Valley Forge<\/b> during the harsh winter of 1777–78. He <b>drilled and trained<\/b> the Continental Army in discipline, marching, and use of the bayonet, turning it into a <b>professional, disciplined fighting force<\/b> that could face British regulars in open battle.<\/p>\n", "check": {"q": "Why is the Battle of Saratoga called the turning point of the Revolution?", "c": ["It was where the Declaration was signed", "It was the last battle of the war", "It was the first battle of the war", "It convinced France to formally ally with the Americans"], "a": 3, "e": "Saratoga proved the Americans could win, which brought France fully into the war."}}, {"title": "The war moves South", "when": "1778–1781", "html": "\n<p>Unable to make headway in the Northeast, the British <b>shifted their focus to the South<\/b>. <b>Why?<\/b> They believed there were <b>many more Loyalists<\/b> in the Southern colonies who would join them, and they hoped to win the South first and then move north.<\/p>\n<p>The British captured Savannah and Charleston. But the British and their Loyalist allies <b>treated Southern civilians harshly<\/b> — burning homes and farms, seizing property, and killing soldiers who were trying to surrender. This brutality <b>\"hardened the revolutionary cause\"<\/b>: it turned many neutral Southerners against Britain and drove them to join the Patriots.<\/p>\n<div class=\"why\"><b>Cause and effect:<\/b> British expected Loyalist support → harsh treatment of civilians → more Southerners joined the Patriots. Their own strategy backfired.<\/div>\n", "check": {"q": "Why did the British shift their focus to the Southern colonies?", "c": ["The French had already captured the North", "The Southern colonies had no militias", "They expected strong Loyalist support there", "The Continental Congress had moved to Georgia"], "a": 2, "e": "Britain counted on Southern Loyalists to help it win — but its harsh tactics pushed many people toward the Patriots."}}, {"title": "Yorktown and the Treaty of Paris", "when": "1781–1783", "html": "\n<p><b>Off the coast of Virginia, September 1781:<\/b> The <b>French navy defeated the British fleet<\/b> at the Battle of the Chesapeake (Virginia Capes). This <b>cut off British reinforcements, supplies, and escape by sea<\/b>.<\/p>\n<p><b>Battle of Yorktown (October 1781):<\/b> British General <b>Cornwallis<\/b> was trapped on the Yorktown peninsula in Virginia — surrounded by <b>Washington's American army and French troops on land<\/b>, and the <b>French navy at sea<\/b>. With no way out and no help coming, he <b>surrendered<\/b>. This was the <b>last major battle<\/b> of the war.<\/p>\n<p><b>Treaty of Paris (1783):<\/b> This <b>officially ended the Revolutionary War<\/b>. Britain <b>recognized the United States as independent<\/b>, and the new nation's western border was set at the <b>Mississippi River<\/b>.<\/p>\n<div class=\"why\"><b>Don't mix them up:<\/b> Treaty of Paris <b>1763<\/b> ended the French & Indian War. Treaty of Paris <b>1783<\/b> ended the American Revolution.<\/div>\n", "check": {"q": "Why did General Cornwallis surrender at Yorktown?", "c": ["King George ordered him to end the war", "He was trapped by American and French armies on land and the French navy at sea", "He had run out of ammunition at Bunker Hill", "His soldiers had all deserted to join the Patriots"], "a": 1, "e": "The French naval victory cut off his escape, and the combined armies surrounded him."}}, {"title": "Impact of the American Revolution", "when": "After 1783", "html": "\n<table class=\"tbl\"><tr><th>Area<\/th><th>Impact<\/th><\/tr>\n<tr><td><b>Government<\/b><\/td><td>The U.S. became an <b>independent nation<\/b> with a <b>republic<\/b> — government by elected representatives instead of a king — first under the Articles of Confederation, later the Constitution.<\/td><\/tr>\n<tr><td><b>Ideas worldwide<\/b><\/td><td>Enlightenment ideals of natural rights and consent of the governed <b>inspired other revolutions<\/b>: the French Revolution (1789), the Haitian Revolution, and independence movements in Latin America.<\/td><\/tr>\n<tr><td><b>African Americans<\/b><\/td><td>The ideals of liberty clashed with slavery. Some enslaved people won freedom by fighting (on both sides), and several <b>Northern states began to abolish slavery<\/b> gradually. But slavery continued and grew in the South.<\/td><\/tr>\n<tr><td><b>Women<\/b><\/td><td>Women ran farms and businesses during the war and supported boycotts (Daughters of Liberty). Abigail Adams urged John to \"remember the ladies,\" but women gained <b>no new political rights<\/b>.<\/td><\/tr>\n<tr><td><b>Native Americans<\/b><\/td><td>Many had sided with Britain. With British protection gone (and the Proclamation Line no longer in effect), <b>American settlers pushed west onto Native lands<\/b>.<\/td><\/tr>\n<tr><td><b>Loyalists<\/b><\/td><td>Many lost property; tens of thousands fled to <b>Canada<\/b> or Britain.<\/td><\/tr><\/table>\n<div class=\"why\"><b>Big idea:<\/b> The Revolution created a new nation built on ideals of liberty and equality, but those ideals were <b>not applied equally<\/b> — enslaved people, women, and Native Americans were largely left out. Those unfinished promises shaped American history for the next 200+ years.<\/div>\n", "check": {"q": "Which was an impact of the American Revolution on Native Americans?", "c": ["They were granted U.S. citizenship and voting rights", "With British protection gone, settlers pushed west onto Native lands", "They were given the Ohio Valley by the Treaty of Paris", "The Proclamation Line was made permanent"], "a": 1, "e": "Many Native nations had sided with Britain; after the war, American expansion accelerated onto their lands."}}], "quiz": [{"q": "What was the significance of the Battle of Saratoga?", "c": ["It was the first battle of the Revolution", "It was the final battle of the war", "It forced the Americans to retreat to Pennsylvania", "It led France to formally ally with the United States"], "a": 3, "e": "Saratoga (1777) = turning point → French alliance (1778)."}, {"q": "What was Baron von Steuben's contribution to the American war effort?", "c": ["He led the French navy at the Chesapeake", "He wrote Common Sense", "He surrendered the British army at Yorktown", "He trained the Continental Army into a disciplined fighting force"], "a": 3, "e": "At Valley Forge he drilled the army in discipline and European-style fighting."}, {"q": "What officially ended the Revolutionary War?", "c": ["The Olive Branch Petition", "The Treaty of Paris of 1783", "The Declaration of Independence", "The Battle of Yorktown"], "a": 1, "e": "Yorktown was the last major battle; the Treaty of Paris (1783) officially ended the war."}, {"q": "How did the French navy contribute to the victory at Yorktown?", "c": ["It carried Washington across the Delaware", "It captured Boston Harbor", "It delivered the Olive Branch Petition", "It defeated the British fleet and blocked Cornwallis's escape by sea"], "a": 3, "e": "Control of the Chesapeake trapped Cornwallis between land and sea."}, {"q": "Which best describes an impact of the American Revolution?", "c": ["The U.S. became a monarchy", "Its ideals of natural rights inspired revolutions in other countries", "Women gained the right to vote", "Slavery was abolished in every state"], "a": 1, "e": "The French and Haitian Revolutions drew on the same Enlightenment ideas."}], "flag": "<b>Heads up:<\/b> these answers follow the video questions in order, using the standard history of each battle. Double-check any specific numbers against the video."}], "cards": [{"sec": "s1", "key": true, "term": "Origins of slavery", "date": "1619 – late 1600s", "def": "Enslaved Africans first arrived at Jamestown in 1619. Over time, colonial slave codes made slavery lifelong, hereditary, and race-based.", "cause": "Cash crops (tobacco, rice, indigo) needed huge amounts of labor; planters wanted workers who could never leave.", "effect": "Southern colonies shifted from indentured servants to enslaved Africans; slavery became the base of the Southern economy.", "sig": "Created a lasting contradiction with the Revolution's ideals of liberty and equality (e.g., Jefferson's slave trade passage cut from the Declaration)."}, {"sec": "s1", "key": true, "term": "Bacon's Rebellion", "date": "1676", "def": "Nathaniel Bacon led poor white and Black frontier farmers and former servants against Virginia's Governor Berkeley; they burned Jamestown.", "cause": "Frontier farmers wanted Native land and felt the governor and rich planters ignored them.", "effect": "Planters feared poor whites and Black servants uniting, so they relied more on enslaved Africans and passed racial laws.", "sig": "Sped up the shift to race-based slavery; early example of colonists rebelling against a royal governor."}, {"sec": "s1", "key": true, "term": "Albany Congress & Plan of Union", "date": "1754", "def": "Meeting of seven colonies in Albany, NY. Benjamin Franklin proposed one colonial government (Grand Council + President-General). Symbol: 'Join, or Die.'", "cause": "Start of the French & Indian War; colonies needed a common defense and an alliance with the Iroquois.", "effect": "Rejected by both the colonial legislatures (didn't want to give up power) and Britain (feared colonial unity).", "sig": "First attempt to unite the colonies — a model for the Stamp Act Congress and the Continental Congresses."}, {"sec": "s1", "key": true, "term": "Impact of colonial expansion on Native Americans", "date": "1600s–1700s", "def": "Colonial growth brought disease, loss of land, wars, trade dependence, and entanglement in European rivalries for Native nations.", "cause": "Settlers kept pushing west for farmland; Britain and France competed for territory and the fur trade.", "effect": "Native populations fell sharply; many sided with France; Pontiac's Rebellion (1763) led to the Proclamation Line.", "sig": "Explains the conflict over western land that runs from the French & Indian War through westward expansion after the Revolution."}, {"sec": "s1", "key": true, "term": "French & Indian War", "date": "1754–1763", "def": "War between Britain (with colonists) and France (with most of its Native allies) over North America. Britain won; Treaty of Paris 1763.", "cause": "Competition over the Ohio River Valley and the fur trade; Washington's clash with the French in 1754.", "effect": "Britain gained Canada and land east of the Mississippi — but was left with huge war debt, so it taxed the colonists and issued the Proclamation of 1763.", "sig": "The starting point of the road to revolution: British debt → taxes → 'no taxation without representation.'"}, {"sec": "s2", "key": true, "term": "Proclamation Line of 1763", "date": "1763", "def": "British order banning colonists from settling west of the Appalachian Mountains.", "cause": "Britain wanted to keep peace with Native Americans (after Pontiac's Rebellion) and avoid another costly war.", "effect": "Colonists were angry and largely ignored it; it was impossible to enforce.", "sig": "One of the first times colonists felt Britain put its interests ahead of theirs."}, {"sec": "s2", "key": true, "term": "Sugar Act", "date": "1764", "def": "Law that lowered the tax on molasses but strictly enforced collection and cracked down on smuggling; violators tried in admiralty courts without juries.", "cause": "War debt from the French & Indian War; Grenville wanted to raise revenue.", "effect": "New York and Massachusetts sent letters of protest; early arguments about no taxation without representation.", "sig": "First law aimed mainly at raising money from the colonies — the opening move in the tax fight."}, {"sec": "s2", "key": false, "term": "Currency Act", "date": "1764", "def": "Law forbidding colonies from issuing paper money.", "cause": "Postwar recession; British merchants demanded debts be paid in British pounds.", "effect": "Made it even harder for colonists to pay their debts.", "sig": "Added economic anger on top of the new taxes."}, {"sec": "s2", "key": true, "term": "Stamp Act", "date": "1765", "def": "Required a tax stamp on paper goods: legal documents, newspapers, almanacs, pamphlets, playing cards, and more. First direct tax on the colonies.", "cause": "Britain needed revenue to pay the cost of defending the colonies after the French & Indian War.", "effect": "Boycotts, riots, stamp distributors forced to resign, Stamp Act Congress; repealed in 1766 (with the Declaratory Act).", "sig": "United the 13 colonies in a common cause; many realized for the first time Britain could act against their interests. Protested for taxation without representation and denial of trial by jury."}, {"sec": "s2", "key": false, "term": "Quartering Act", "date": "1765 (and 1774)", "def": "Required colonies to house and supply British troops.", "cause": "Britain kept soldiers in America after the French & Indian War.", "effect": "Colonists resented paying for and housing an army during peacetime.", "sig": "Listed as a grievance in the Declaration ('Quartering large bodies of armed troops among us')."}, {"sec": "s2", "key": true, "term": "Stamp Act Congress", "date": "October 1765", "def": "Meeting of delegates from nine colonies in New York City that passed resolutions and petitioned the king and Parliament.", "cause": "The Stamp Act.", "effect": "Declared colonists could not be represented in the House of Commons, so only their own legislatures could tax them.", "sig": "First time the colonies acted together in protest — a step toward the Continental Congresses. Still loyal, not seeking independence."}, {"sec": "s2", "key": true, "term": "Sons of Liberty (Sam Adams, Paul Revere)", "date": "1765 on", "def": "Secret Patriot protest groups. Sam Adams = Boston organizer and propagandist; Paul Revere = silversmith, engraver, midnight rider. Tactics: boycotts, propaganda, intimidation, tarring and feathering, destroying property.", "cause": "The Stamp Act.", "effect": "Forced stamp distributors to resign; spread propaganda (Boston Massacre engraving); organized the Boston Tea Party.", "sig": "Turned scattered anger into an organized resistance movement."}, {"sec": "s2", "key": false, "term": "Daughters of Liberty", "date": "1760s", "def": "Women's groups that supported boycotts by making homespun cloth and refusing British goods like tea.", "cause": "Stamp Act and Townshend Acts boycotts.", "effect": "Made boycotts possible by replacing British goods with colonial ones.", "sig": "Showed women played an active role in the resistance."}, {"sec": "s2", "key": false, "term": "Declaratory Act", "date": "1766", "def": "Law passed the same day the Stamp Act was repealed, stating Parliament could make laws for the colonies 'in all cases whatsoever.'", "cause": "Parliament repealed the Stamp Act but didn't want to look weak.", "effect": "Paved the way for new taxes like the Townshend Acts.", "sig": "Showed Britain backing down on a tax but refusing to give up its authority — a repeating pattern."}, {"sec": "s3", "key": true, "term": "Townshend Acts", "date": "1767", "def": "Taxes on goods imported from Britain: paper, paints, glass, and tea.", "cause": "Britain still needed revenue after repealing the Stamp Act.", "effect": "Boycotts (Boston, then Philadelphia and New York in 1768), harassment of tax collectors → British troops sent to Boston. Repealed in 1770 except the tax on tea.", "sig": "Restarted colonial resistance; brought the troops that led to the Boston Massacre."}, {"sec": "s3", "key": true, "term": "Writs of Assistance", "date": "1760s (strengthened 1767)", "def": "General search warrants letting customs officers search ships, warehouses, and homes for smuggled goods without naming a specific place or reason.", "cause": "Britain wanted to stop smuggling and enforce trade taxes (Townshend Acts).", "effect": "Colonists saw them as a violation of their rights as Englishmen.", "sig": "Later influenced the 4th Amendment's protection against unreasonable searches."}, {"sec": "s6", "key": true, "term": "Boston Massacre", "date": "March 5, 1770", "def": "British soldiers fired into a crowd on King Street in Boston, killing five colonists, including Crispus Attucks.", "cause": "Troops stationed in Boston to enforce the Townshend Acts; job competition and street clashes; a crowd harassed a sentry.", "effect": "Patriots used it as propaganda (Revere's engraving); John Adams defended the soldiers, most found not guilty.", "sig": "Likely confusion and panic, but publicized as a symbol of British brutality — turned opinion against Britain."}, {"sec": "s3", "key": false, "term": "Committees of Correspondence", "date": "1772–1774", "def": "Networks created by Samuel Adams to share news of British actions; became extra-legal (unofficial) governments.", "cause": "Growing British control; later, the Intolerable Acts.", "effect": "Linked towns and colonies together; helped lead to the First Continental Congress.", "sig": "Built colonial unity and communication before the war."}, {"sec": "s3", "key": true, "term": "Tea Act", "date": "1773", "def": "Gave the British East India Company a monopoly on the tax-free transport and sale of tea in the colonies.", "cause": "Parliament wanted to help the struggling East India Company.", "effect": "Colonial tea traders couldn't compete; colonists boycotted and staged the Boston Tea Party.", "sig": "Revived protest after a quiet period and led directly to the Tea Party."}, {"sec": "s3", "key": true, "term": "Boston Tea Party", "date": "December 16, 1773", "def": "Colonists disguised as Native Americans (organized by the Sons of Liberty) boarded East India Company ships and dumped the tea into Boston Harbor.", "cause": "The Tea Act monopoly.", "effect": "Britain passed the Coercive (Intolerable) Acts to punish Boston.", "sig": "Open defiance that pushed Britain into a harsh crackdown, uniting the colonies further."}, {"sec": "s3", "key": true, "term": "Intolerable (Coercive) Acts", "date": "1774", "def": "Punishment laws: closed Boston's port, curfew, banned town meetings, made General Gage military governor, let royal governors quarter troops.", "cause": "The Boston Tea Party.", "effect": "Committees of Correspondence acted as unofficial governments; colonies called the First Continental Congress.", "sig": "Meant to isolate Boston but instead united the colonies against Britain."}, {"sec": "s3", "key": true, "term": "First Continental Congress", "date": "September 1774", "def": "Meeting of colonial representatives in Philadelphia that sent a list of grievances to King George III and called for a boycott of British goods.", "cause": "The Intolerable Acts; colonists agreed a collective response was needed.", "effect": "Parliament declared the colonies in rebellion; General Gage was removed for suggesting repeal.", "sig": "Colonies acted together like a nation — but still asked the king for help rather than seeking independence."}, {"sec": "s4", "key": true, "term": "Battle of Lexington and Concord", "date": "April 1775", "def": "First battles of the Revolution. 700 redcoats marched to capture leaders and destroy weapons; minutemen (warned by Revere, Dawes, Prescott) fought back and ambushed the British.", "cause": "British attempt to seize colonial weapons at Concord and capture Hancock and Sam Adams.", "effect": "British retreated to Boston; war began; Second Continental Congress met in May 1775.", "sig": "An American 'victory' that proved colonial militia could stand up to the powerful British army."}, {"sec": "s4", "key": true, "term": "Second Continental Congress", "date": "May 1775", "def": "Colonial delegates met in Philadelphia after Lexington and Concord and acted as a central government.", "cause": "Fighting at Lexington and Concord.", "effect": "Printed paper money, created the Continental Army, appointed George Washington; sent the Olive Branch Petition; adopted the Declaration.", "sig": "Became the governing body that led the colonies through the war and declared independence."}, {"sec": "s4", "key": true, "term": "Battle of Bunker Hill", "date": "June 1775", "def": "Colonists fortified Breed's Hill near Boston; General Gage attacked. British took the hill on the third charge. ~450 colonial vs. 1,000+ British casualties.", "cause": "Colonial militia had the British trapped in Boston after Lexington and Concord.", "effect": "Americans gained confidence; British saw the war would be long and costly.", "sig": "A British win on paper, but it showed Americans could fight a trained army."}, {"sec": "s4", "key": true, "term": "Olive Branch Petition", "date": "July 8, 1775", "def": "Petition from the Second Continental Congress declaring loyalty to King George III and asking him to restore peace and protect their rights.", "cause": "Most delegates still felt loyalty to the crown and hoped to avoid full war.", "effect": "King rejected it, declared the colonies in rebellion, and urged a naval blockade.", "sig": "Last attempt at reconciliation — its rejection pushed moderates toward independence."}, {"sec": "s4", "key": true, "term": "Common Sense (Thomas Paine)", "date": "January 1776", "def": "Anonymous 47-page pamphlet by self-educated Thomas Paine attacking the king and monarchy and arguing for independence in plain language.", "cause": "King's rejection of the Olive Branch Petition; war already underway; colonists still torn.", "effect": "About 500,000 copies sold; read aloud to Washington's soldiers; public opinion shifted toward independence.", "sig": "Convinced ordinary colonists that independence was the answer — paved the way for the Declaration."}, {"sec": "s4", "key": false, "term": "Loyalists vs. Patriots", "date": "1775–1783", "def": "Loyalists (Tories) opposed independence and stayed loyal to the crown; Patriots supported independence.", "cause": "Loyalists: government jobs, business ties to Britain, trust in the crown. Patriots: hoped for more economic opportunity and rights.", "effect": "Colonists were divided; many Loyalists fled to Canada or Britain after the war.", "sig": "The Revolution was also a conflict among colonists, not only against Britain."}, {"sec": "s5", "key": true, "term": "Declaration of Independence", "date": "July 4, 1776", "def": "Document written mainly by Thomas Jefferson declaring the colonies free and independent. Three parts: statement of rights, grievances against the king, formal declaration.", "cause": "Rejected Olive Branch Petition, Common Sense, war already underway; colonies like NC and VA pushing for independence.", "effect": "Colonies officially broke from Britain; signaled to France they were serious → alliance possible.", "sig": "Based on John Locke's ideas: unalienable rights (life, liberty, pursuit of happiness), consent of the governed, right to alter or abolish government. Slave trade passage removed."}, {"sec": "s5", "key": false, "term": "John Locke & natural rights", "date": "Enlightenment (late 1600s)", "def": "English philosopher who argued people have natural rights to life, liberty, and property, and that government exists to protect them.", "cause": "Enlightenment thinking about reason and government.", "effect": "Jefferson used Locke's ideas in the Declaration ('Life, Liberty and the pursuit of Happiness').", "sig": "Gave the colonists a philosophical justification for revolution."}, {"sec": "s6", "key": false, "term": "Paul Revere's engraving", "date": "1770", "def": "'The Bloody Massacre in King-Street' — an image showing soldiers firing in a neat line on peaceful colonists.", "cause": "The Boston Massacre; Revere was a Patriot and Son of Liberty.", "effect": "Spread through the colonies and turned opinion against the British troops.", "sig": "Classic example of propaganda: colonists = victims, soldiers = aggressors."}, {"sec": "s6", "key": false, "term": "John Adams defends the soldiers", "date": "1770", "def": "Patriot lawyer John Adams defended the British soldiers in court; most were found not guilty.", "cause": "Adams believed everyone deserved a fair trial and in the rule of law.", "effect": "Showed the colonies could deliver justice, not mob rule.", "sig": "Contrast with Revere's propaganda: two very different points of view on the same event."}, {"sec": "s7", "key": false, "term": "Crossing the Delaware / Trenton", "date": "December 25–26, 1776", "def": "Washington crossed the Delaware River on Christmas night and surprised Hessian troops at Trenton, NJ.", "cause": "The army had shrunk to a few thousand men after losing Fort Washington and Fort Lee, with enlistments expiring.", "effect": "A quick victory (then Princeton) that got soldiers to re-enlist.", "sig": "Saved the army's morale when the Revolution was close to collapse."}, {"sec": "s7", "key": false, "term": "Battle of Saratoga", "date": "October 1777", "def": "American victory in New York where British General Burgoyne surrendered his army.", "cause": "British plan to cut off New England.", "effect": "France formally allied with the United States (1778).", "sig": "The turning point of the war."}, {"sec": "s7", "key": false, "term": "Baron von Steuben", "date": "1777–1778", "def": "Prussian officer who drilled the Continental Army at Valley Forge.", "cause": "The army lacked discipline and training.", "effect": "The army became a professional, disciplined force.", "sig": "Allowed Americans to face British regulars in open battle."}, {"sec": "s7", "key": false, "term": "Battle of Yorktown", "date": "October 1781", "def": "Final major battle; Cornwallis surrendered after being trapped by American and French armies on land and the French navy at sea.", "cause": "British Southern strategy; French navy defeated the British fleet off Virginia (Sept. 1781).", "effect": "Britain gave up the war; peace talks began.", "sig": "Effectively won the war for the Americans."}, {"sec": "s7", "key": false, "term": "Treaty of Paris (1783)", "date": "1783", "def": "Treaty that officially ended the Revolutionary War; Britain recognized U.S. independence with a western border at the Mississippi River.", "cause": "Yorktown surrender.", "effect": "The United States became an independent nation.", "sig": "Don't confuse with the Treaty of Paris of 1763 (end of the French & Indian War)."}, {"sec": "s7", "key": true, "term": "Impact of the American Revolution", "date": "1783 on", "def": "Results of the Revolution for the new nation and the world.", "cause": "American victory in the war and the ideals of the Declaration.", "effect": "New republic; inspired the French and Haitian Revolutions; some Northern states began ending slavery; women gained no political rights; settlers pushed onto Native lands; Loyalists fled.", "sig": "Created a nation built on liberty and equality — ideals that were not yet applied to everyone."}], "tests": [[{"q": "Which development was a direct result of Bacon's Rebellion?", "c": ["The Proclamation Line was drawn", "Jamestown became the capital of all the colonies", "Virginia planters increasingly relied on enslaved African labor", "The Albany Plan of Union was adopted"], "a": 2, "e": "Fear of poor whites and Black servants uniting pushed planters toward enslaved labor and racial laws.", "s": "s1"}, {"q": "Benjamin Franklin's 'Join, or Die' cartoon was created to support", "c": ["the Declaration of Independence", "the Olive Branch Petition", "the Albany Plan of Union", "the Boston Tea Party"], "a": 2, "e": "Franklin drew it in 1754 to urge the colonies to unite during the French & Indian War.", "s": "s1"}, {"q": "What was the main cause of the French & Indian War?", "c": ["The Boston Massacre", "British and French competition over the Ohio River Valley", "A dispute over tea taxes", "Colonial anger over the Stamp Act"], "a": 1, "e": "Both empires claimed the Ohio Valley for land and the fur trade.", "s": "s1"}, {"q": "'Protection and Obedience are reciprocal; Great-Britain protects America, America is bound to yield Obedience.' This argument was made by", "c": ["George Grenville, defending the Stamp Act", "the Stamp Act Congress", "Thomas Paine, in Common Sense", "William Pitt, opposing the Stamp Act"], "a": 0, "e": "Grenville argued Britain went into debt protecting America, so Americans owed a share of the cost.", "s": "s2"}, {"q": "Which colonial action was the most effective in getting the Stamp Act repealed?", "c": ["Boycotts of British goods that hurt London merchants", "Declaring independence", "Winning the Battle of Bunker Hill", "Sending representatives to Parliament"], "a": 0, "e": "London merchants, hurt by the boycott, persuaded Parliament to repeal the act.", "s": "s2"}, {"q": "Which statement best reflects the view of the Stamp Act Congress?", "c": ["Colonists should declare independence immediately", "Colonists cannot be represented in Parliament, so only colonial legislatures may tax them", "Colonists should pay the tax but ask for lower rates", "Parliament may tax the colonies in all cases whatsoever"], "a": 1, "e": "Resolutions IV and V argue exactly this.", "s": "s2"}, {"q": "Which was a tactic used by the Sons of Liberty?", "c": ["Writing the Albany Plan", "Tarring and feathering tax collectors", "Drafting the Declaration of Independence", "Commanding the Continental Army"], "a": 1, "e": "Intimidation of tax collectors was a common Sons of Liberty tactic.", "s": "s2"}, {"q": "Colonists objected to writs of assistance mainly because they", "c": ["banned settlement in the West", "raised the tax on tea", "allowed searches without a specific reason, violating colonists' rights", "forced colonists to house soldiers"], "a": 2, "e": "They were general search warrants, later a reason for the 4th Amendment.", "s": "s3"}, {"q": "Why did Parliament pass the Coercive Acts in 1774?", "c": ["To punish Boston for the Boston Tea Party", "To pay off the French & Indian War debt", "To end the Revolutionary War", "To reward colonists for their loyalty"], "a": 0, "e": "Britain renamed them 'Coercive'; colonists called them 'Intolerable.'", "s": "s3"}, {"q": "Which sequence is correct?", "c": ["Stamp Act → Townshend Acts → Boston Massacre → Tea Act", "Tea Act → Stamp Act → Boston Massacre → Townshend Acts", "Townshend Acts → Stamp Act → Tea Act → Boston Massacre", "Boston Massacre → Stamp Act → Tea Act → Townshend Acts"], "a": 0, "e": "1765 → 1767 → 1770 → 1773.", "s": "s3"}, {"q": "The First Continental Congress responded to the Intolerable Acts by", "c": ["declaring independence", "sending grievances to the king and calling for a boycott of British goods", "passing the Tea Act", "appointing George Washington commander"], "a": 1, "e": "They still appealed to the king and used economic pressure.", "s": "s3"}, {"q": "Paul Revere, William Dawes, and Samuel Prescott are known for", "c": ["warning that British troops were marching toward Lexington and Concord", "negotiating the Treaty of Paris", "writing Common Sense", "leading the Boston Tea Party dressed as Mohawks"], "a": 0, "e": "They rode to warn leaders and townspeople in April 1775.", "s": "s4"}, {"q": "Which action taken by the Second Continental Congress shows it was acting as a government?", "c": ["Sending grievances to the king in 1774", "Boycotting British tea", "Printing money and organizing an army", "Forming the Sons of Liberty"], "a": 2, "e": "Printing money and running an army are powers of a government.", "s": "s4"}, {"q": "George Washington wrote, 'I find Common Sense is working a powerful change in the minds of many men.' What change was he describing?", "c": ["Growing opposition to the Continental Army", "Growing support for the king", "Growing interest in joining France", "Growing support for independence"], "a": 3, "e": "Paine's pamphlet turned many colonists toward independence.", "s": "s4"}, {"q": "'We hold these truths to be self-evident, that all men are created equal...' reflects the ideas of which thinker?", "c": ["George Grenville", "John Locke", "King George III", "Daniel Leonard"], "a": 1, "e": "Locke's natural rights philosophy underlies the Declaration.", "s": "s5"}, {"q": "The grievance 'For imposing Taxes on us without our Consent' refers to", "c": ["the Olive Branch Petition", "the Proclamation of 1763", "Bacon's Rebellion", "acts like the Stamp Act and Townshend Acts"], "a": 3, "e": "These were taxes passed without colonial representation.", "s": "s5"}, {"q": "In Paul Revere's engraving of the Boston Massacre, the colonists are portrayed as", "c": ["trained soldiers", "British Loyalists", "violent aggressors", "peaceful victims"], "a": 3, "e": "They appear unarmed and calm while the soldiers fire deliberately.", "s": "s6"}, {"q": "Which question helps identify a source's POINT OF VIEW rather than its argument?", "c": ["What year did the war end?", "Who created it and what side were they on?", "How many people died?", "What does the source want you to believe?"], "a": 1, "e": "POV is about the creator's position; argument is what they want you to believe.", "s": "s6"}, {"q": "What officially ended the Revolutionary War?", "c": ["The Battle of Saratoga", "The Treaty of Paris of 1783", "The Treaty of Paris of 1763", "The Declaration of Independence"], "a": 1, "e": "1783 ended the Revolution; 1763 ended the French & Indian War.", "s": "s7"}, {"q": "Why was the Battle of Saratoga significant?", "c": ["It convinced France to formally ally with the United States", "It was the first battle of the war", "It ended the war", "It forced Washington to retreat to Pennsylvania"], "a": 0, "e": "Saratoga (1777) proved the Americans could win → French alliance.", "s": "s7"}], [{"q": "The shift from indentured servants to enslaved Africans in the Southern colonies was mainly driven by", "c": ["the Boston Massacre", "British laws requiring slavery", "the labor needs of cash crops like tobacco", "the Albany Congress"], "a": 2, "e": "Tobacco, rice, and indigo required a large, permanent workforce.", "s": "s1"}, {"q": "Many Native American nations allied with the French during the French & Indian War because", "c": ["the British had already left North America", "the French promised them independence", "French colonists mainly traded rather than taking land for farms", "the French were Protestant"], "a": 2, "e": "British settlement threatened Native land far more than the French fur trade did.", "s": "s1"}, {"q": "Which of the following was an effect of the French & Indian War?", "c": ["Slavery was abolished", "The colonies declared independence", "Britain went deeply into debt", "France gained Canada"], "a": 2, "e": "The war debt led Britain to tax the colonies.", "s": "s1"}, {"q": "The Proclamation of 1763 angered colonists because it", "c": ["gave the East India Company a monopoly", "closed the port of Boston", "placed a tax on newspapers", "banned settlement west of the Appalachian Mountains"], "a": 3, "e": "Colonists felt they had fought for that land.", "s": "s2"}, {"q": "Why was the Stamp Act considered a violation of colonial rights?", "c": ["It banned town meetings", "It forced colonists to join the British army", "It was a tax passed without colonial representation, and violators were tried without juries", "It gave land to Native Americans"], "a": 2, "e": "Taxation without representation and no trial by jury — the two grounds on your handout.", "s": "s2"}, {"q": "William Pitt argued that Britain should", "c": ["tax the colonies more heavily", "keep the Stamp Act and send troops", "give the colonies independence", "repeal the Stamp Act but still assert its authority over the colonies"], "a": 3, "e": "He opposed taking colonists' money without consent but supported British sovereignty.", "s": "s2"}, {"q": "The Pennsylvania Journal printed a skull and crossbones and the word 'EXPIRING' on the day before the Stamp Act took effect. What was the paper's message?", "c": ["The paper supported the Stamp Act", "A war with France was starting", "The editor was retiring", "The stamp tax would kill the newspaper"], "a": 3, "e": "Newspapers had to buy stamps, so the tax threatened their survival.", "s": "s2"}, {"q": "Which goods were taxed under the Townshend Acts?", "c": ["Paper, paints, glass, and tea", "Tobacco and cotton", "Playing cards and legal documents", "Sugar and molasses"], "a": 0, "e": "Remember: Townshend = paper, paints, glass, tea.", "s": "s3"}, {"q": "Why did British soldiers and Boston workers often clash before 1770?", "c": ["Off-duty soldiers competed with workers for jobs", "Soldiers were collecting the stamp tax", "Soldiers had closed the port", "Workers were Loyalists who supported the troops"], "a": 0, "e": "Poorly paid soldiers took local jobs, creating resentment.", "s": "s3"}, {"q": "Colonists disguised as Native Americans dumped tea into Boston Harbor in response to", "c": ["the Intolerable Acts", "the Sugar Act", "the Declaratory Act", "the Tea Act"], "a": 3, "e": "The Tea Party (Dec. 1773) protested the East India Company monopoly.", "s": "s3"}, {"q": "General Gage was removed from his post after he", "c": ["lost the Battle of Yorktown", "joined the Sons of Liberty", "suggested Parliament repeal the Intolerable Acts", "signed the Olive Branch Petition"], "a": 2, "e": "London wanted a harder line, not compromise.", "s": "s3"}, {"q": "Why was Lexington and Concord considered a victory for the colonists?", "c": ["France joined the war the next day", "Colonial militia forced the powerful British army to retreat", "It ended the war", "The colonists captured General Gage"], "a": 1, "e": "Ordinary militia held off and drove back professional soldiers.", "s": "s4"}, {"q": "The Olive Branch Petition was significant because", "c": ["it created the Continental Army", "its rejection pushed many colonists away from reconciliation", "it declared independence", "it ended the Stamp Act"], "a": 1, "e": "King George refused it and declared the colonies in rebellion.", "s": "s4"}, {"q": "Which group was MOST likely to support independence?", "c": ["Merchants whose business depended on British trade", "Royal government officials", "Colonists who believed independence would bring more economic opportunity", "Colonists who trusted the crown to protect their rights"], "a": 2, "e": "The other three describe typical Loyalists.", "s": "s4"}, {"q": "Which was one of the three main parts of the Declaration of Independence?", "c": ["A list of new taxes", "A plan for a Continental Army", "A treaty with France", "A list of grievances against King George III"], "a": 3, "e": "Rights → grievances → declaration of independence.", "s": "s5"}, {"q": "What contradiction does the removal of Jefferson's slave trade passage reveal?", "c": ["The colonists wanted to stay loyal to Britain", "The Declaration claimed all men are created equal while slavery continued", "Southern colonies wanted to ban slavery", "Jefferson opposed independence"], "a": 1, "e": "Southern delegates forced its removal, exposing the gap between ideals and reality.", "s": "s5"}, {"q": "Why did John Adams defend the British soldiers after the Boston Massacre?", "c": ["He had fired the first shot", "He was a Loyalist", "He believed in the right to a fair trial and the rule of law", "He wanted to become a British official"], "a": 2, "e": "Adams wanted to show the colonies could provide justice.", "s": "s6"}, {"q": "Paul Revere's engraving is best described as", "c": ["a neutral news photograph", "a Loyalist newspaper cartoon", "a primary source created as Patriot propaganda", "a secondary source by a British historian"], "a": 2, "e": "He made it about three weeks after the event to stir anti-British anger.", "s": "s6"}, {"q": "What did Baron von Steuben do for the Continental Army?", "c": ["Wrote the Olive Branch Petition", "Led it across the Delaware", "Trained it into a disciplined, professional force at Valley Forge", "Commanded the French fleet"], "a": 2, "e": "His drilling made the army able to face British regulars.", "s": "s7"}, {"q": "Why did the British shift their war effort to the South?", "c": ["The French controlled the North", "The Continental Congress had fled south", "The Southern colonies had surrendered", "They expected strong support from Loyalists"], "a": 3, "e": "British leaders believed Southern Loyalists would rise up to help them.", "s": "s7"}], [{"q": "The Albany Plan of Union is significant because it was", "c": ["an agreement to end slavery", "the first attempt to unite the colonies under one government", "the first tax on the colonies", "the document that ended the French & Indian War"], "a": 1, "e": "It failed, but it foreshadowed later colonial cooperation.", "s": "s1"}, {"q": "Pontiac's Rebellion (1763) helps explain why Britain", "c": ["passed the Tea Act", "issued the Proclamation Line of 1763", "repealed the Stamp Act", "called the Albany Congress"], "a": 1, "e": "Britain wanted to prevent more frontier wars with Native Americans.", "s": "s1"}, {"q": "Nathaniel Bacon's rebellion showed that", "c": ["Native Americans supported the governor's enemies", "the colonies were ready to declare independence", "the French controlled Virginia", "poor white and Black Virginians could unite against the colonial elite"], "a": 3, "e": "That alliance is what frightened wealthy planters.", "s": "s1"}, {"q": "What does the timeline's layout — British actions above the line, colonial reactions below — best help students see?", "c": ["The exact number of people killed in each event", "Cause-and-effect patterns between British policies and colonial resistance", "Which colonies were founded first", "The causes of the French & Indian War"], "a": 1, "e": "Each British action is followed by a colonial reaction.", "s": "s2"}, {"q": "The Declaratory Act (1766) stated that", "c": ["Parliament could make laws for the colonies in all cases whatsoever", "the colonies were independent", "only colonial legislatures could tax the colonies", "colonists could settle west of the Appalachians"], "a": 0, "e": "Passed the same day the Stamp Act was repealed.", "s": "s2"}, {"q": "Daniel Leonard wrote, 'It is our highest interest to continue a part of the British empire.' His intended audience was", "c": ["members of Parliament", "the French government", "colonists in Massachusetts", "King George III"], "a": 2, "e": "His letters were addressed 'to the Inhabitants of the Province of Massachusetts Bay.'", "s": "s2"}, {"q": "The Sugar Act of 1764 upset colonists mainly because Britain", "c": ["banned sugar in the colonies", "began strictly enforcing tax collection and cracking down on smuggling", "closed Boston's port", "placed stamps on sugar packages"], "a": 1, "e": "Strict enforcement meant colonists actually had to pay.", "s": "s2"}, {"q": "The Committees of Correspondence helped the colonies by", "c": ["negotiating with France", "commanding the Continental Army", "sharing information and coordinating resistance among colonies", "collecting British taxes"], "a": 2, "e": "They acted as communication networks and unofficial governments.", "s": "s3"}, {"q": "Closing the port of Boston was an especially harsh punishment because", "c": ["Boston's economy depended on trade", "the port was the only place tea was sold", "it stopped the Continental Congress from meeting", "Boston had no farms"], "a": 0, "e": "Shutting the port cut off jobs, goods, and food.", "s": "s3"}, {"q": "The repeal of the Townshend Acts in 1770 kept a tax on", "c": ["paper", "molasses", "glass", "tea"], "a": 3, "e": "Parliament kept the tea tax to show it still had the right to tax.", "s": "s3"}, {"q": "The Boston Tea Party is an example of which kind of colonial resistance?", "c": ["A formal declaration of war", "Direct action that destroyed property", "A legal challenge in court", "A peaceful petition to the king"], "a": 1, "e": "Dumping the tea destroyed the East India Company's property.", "s": "s3"}, {"q": "At the Battle of Bunker Hill, the British", "c": ["were led by George Washington", "captured the hill but suffered over 1,000 casualties", "lost fewer than 100 soldiers", "were defeated and surrendered"], "a": 1, "e": "A costly British victory.", "s": "s4"}, {"q": "Which describes Thomas Paine and Common Sense?", "c": ["A self-educated writer whose plain-language pamphlet attacked monarchy", "A Loyalist who urged obedience to Parliament", "A wealthy lawyer who defended British soldiers", "A British official who defended the Stamp Act"], "a": 0, "e": "Paine wrote for the common man and blamed the king for tyranny.", "s": "s4"}, {"q": "Which event happened AFTER the Olive Branch Petition was rejected?", "c": ["First Continental Congress", "Battle of Lexington and Concord", "Battle of Bunker Hill", "Publication of Common Sense"], "a": 3, "e": "Common Sense came out in January 1776; the others were earlier.", "s": "s4"}, {"q": "According to the Declaration, if a government becomes destructive of people's rights, the people have the right to", "c": ["alter or abolish it", "elect a new king", "move to another colony", "petition Parliament"], "a": 0, "e": "The right of revolution comes from Locke.", "s": "s5"}, {"q": "Which members were on the committee that drafted the Declaration?", "c": ["Washington, Paine, Revere, and Hancock", "Bacon, Berkeley, and Franklin", "Pitt, Grenville, and Gage", "Jefferson, Adams, Franklin, Sherman, and Livingston"], "a": 3, "e": "The Committee of Five; Jefferson wrote the draft.", "s": "s5"}, {"q": "Which source would a historian likely consider MORE biased toward the colonists' side of the Boston Massacre?", "c": ["Court records of the soldiers' trial", "A report from a neutral observer", "John Adams's defense of the soldiers", "Paul Revere's engraving"], "a": 3, "e": "Revere was a Patriot creating propaganda.", "s": "s6"}, {"q": "The reading says the Boston Massacre was 'almost certainly the result of confusion and panic.' Which source's portrayal is closer to that description?", "c": ["Revere's engraving, showing orderly soldiers firing on command", "The HBO John Adams series, showing a chaotic crowd and frightened soldiers", "Neither source shows the event", "Both sources show it the same way"], "a": 1, "e": "Revere's version makes it look deliberate; the series shows confusion.", "s": "s6"}, {"q": "Why did General Cornwallis surrender at Yorktown in 1781?", "c": ["His army was defeated at Trenton", "He ran out of soldiers after Saratoga", "He was surrounded by American and French forces on land and cut off by the French navy at sea", "The king ordered him home"], "a": 2, "e": "The French naval victory off Virginia sealed the trap.", "s": "s7"}, {"q": "Which was an impact of the American Revolution?", "c": ["Native Americans gained protected land in the Ohio Valley", "The U.S. became part of France", "Several Northern states began to gradually abolish slavery", "Women gained the right to vote"], "a": 2, "e": "Revolutionary ideals led some Northern states to begin ending slavery.", "s": "s7"}]], "images": {"timeline": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAA0JCgsKCA0LCgsODg0PEyAVExISEyccHhcgLikxMC4pLSwzOko+MzZGNywtQFdBRkxOUlNSMj5aYVpQYEpRUk//wAALCAQ6BXgBAREA/8QAGwABAAIDAQEAAAAAAAAAAAAAAAQFAgMGAQf/xABYEAABBAIABAMEBAoGBwUGAgsBAAIDBAURBhIhMRNBURQiYXEVMoGRBxYjNTZCdKGxsjM0UnOzwSRWYnKCwvBDkpTR4RclJmOi0vE3U8NUdYNERUZVk+L/2gAIAQEAAD8A+nIiIiIiIiIiIvCQCASNnsvUB2NhERERERERER <script>
(function(){
  var D = JSON.parse(document.getElementById('data').textContent);
  var SEC = D.sections, byId = {};
  SEC.forEach(function(s){ byId[s.id] = s; });
  var app = document.getElementById('app');
  var LET = ['A','B','C','D','E'];
  var state = { view:'home', answered:{}, quiz:{}, test:null, fc:{filter:'all', order:[], i:0} };

  function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function applyColors(root){
    root.querySelectorAll('[data-color]').forEach(function(el){ el.style.setProperty('--c', el.getAttribute('data-color')); });
    root.querySelectorAll('img[data-img]').forEach(function(el){ var k = el.getAttribute('data-img'); if (D.images[k]) el.src = D.images[k]; });
  }

  function renderSecbar(){
    var bar = document.getElementById('secbar');
    var inLearn = /^s\d$/.test(state.view);
    if (!inLearn){ bar.innerHTML=''; bar.style.display='none'; return; }
    bar.style.display='flex';
    bar.innerHTML = SEC.map(function(s){
      return '<button data-go="'+s.id+'" data-color="'+s.color+'" class="'+(state.view===s.id?'on':'')+'">'+s.num+'. '+esc(s.title)+'</button>';
    }).join('');
    applyColors(bar);
    var on = bar.querySelector('.on'); if (on) bar.scrollLeft = on.offsetLeft - 20;
  }
  function setNav(){
    document.querySelectorAll('.nav button').forEach(function(b){
      var g=b.getAttribute('data-go'), v=state.view;
      var on = (g==='home'&&v==='home')||(g==='s1'&&/^s\d$/.test(v))||(g==='cards'&&v==='cards')||(g==='tests'&&(v==='tests'||v.indexOf('test')===0));
      b.classList.toggle('on', on);
    });
  }

  /* ---------- question rendering ---------- */
  function qHTML(q, id, label, mode){
    // mode: 'instant' or 'test'
    var h = '<div class="q" data-qid="'+id+'">';
    if (label) h += '<div class="lab">'+esc(label)+'</div>';
    h += '<div class="stem">'+esc(q.q)+'</div><div class="opts">';
    q.c.forEach(function(c,i){
      h += '<button class="opt" data-mode="'+mode+'" data-qid="'+id+'" data-i="'+i+'"><span class="l">'+LET[i]+'</span><span>'+esc(c)+'</span></button>';
    });
    h += '</div><div class="fbwrap"></div></div>';
    return h;
  }
  function findQ(id){
    var p = id.split('|'); // kind|sec|idx
    var s = byId[p[1]];
    if (p[0]==='ck') return s.lessons[+p[2]].check;
    if (p[0]==='qz') return s.quiz[+p[2]];
    return null;
  }
  function showInstant(box, q, pick){
    var btns = box.querySelectorAll('.opt');
    btns.forEach(function(b,i){ b.disabled = true; if (i===q.a) b.classList.add('right'); else if (i===pick) b.classList.add('wrong'); });
    var ok = pick===q.a;
    box.querySelector('.fbwrap').innerHTML = '<div class="fb '+(ok?'good':'bad')+'"><b>'+(ok?'Correct.':'Not quite — the answer is '+LET[q.a]+'.')+'</b> '+esc(q.e)+'</div>';
  }

  /* ---------- views ---------- */
  function viewHome(){
    var h = '<section class="hero"><h1>The Road to Revolution</h1><p class="sub">US History I study guide for the unit on Early Interactions, Colonial America, and the Road to &amp; American Revolution. The test is multiple choice: for every key term, know the definition, its causes and effects, and why it matters.</p>';
    h += '<div class="road"><div class="road-years"><span>1619</span><span>1783</span></div><div class="stops">';
    SEC.forEach(function(s){
      h += '<button class="stop" data-go="'+s.id+'" data-color="'+s.color+'"><span class="n">'+s.num+'</span><span class="t">'+esc(s.title)+'</span><span class="y">'+esc(s.years)+'</span></button>';
    });
    h += '</div></div></section>';
    h += '<div class="panel"><h2>How to use this guide</h2><p>Work through <b>Learn</b> in order. The sections follow the order your assignments were posted in Google Classroom. Each lesson ends with a check-in question, and each section ends with a 5-question quiz. Then drill the <b>Flashcards</b> (definition, cause, effect, significance) and take the three <b>Practice tests</b>.</p></div>';
    h += '<div class="panel"><h2>The 24 key terms</h2><p class="muted">From your study guide. Tap one to jump to the section that teaches it.</p><div class="terms">';
    D.cards.filter(function(c){return c.key;}).forEach(function(c){
      h += '<button class="term" data-go="'+c.sec+'" data-color="'+byId[c.sec].color+'">'+esc(c.term)+'</button>';
    });
    h += '</div></div>';
    h += '<div class="panel"><h2>Key skills</h2><p><b>Interpretation</b> — what is the source saying? <b>Historical context</b> — what was happening at the time? <b>Intended audience</b> — who was it written for? <b>Point of view</b> — who made it and where did they stand? <b>Causation</b> — what caused it, and what did it cause? Sections 2 and 6 practice these directly, and the quizzes include skill questions.</p></div>';
    app.innerHTML = h;
  }

  function viewSection(id){
    var s = byId[id], idx = SEC.indexOf(s);
    var h = '<div data-color="'+s.color+'">';
    h += '<div class="sechead"><div class="k">Section '+s.num+' &nbsp; '+esc(s.years)+'</div><h1>'+esc(s.title)+'</h1><div class="src">Class material: '+esc(s.source)+'</div></div>';
    if (s.flag) h += '<div class="flag">'+s.flag+'</div>';
    h += '<p>'+esc(s.intro)+'</p>';
    s.lessons.forEach(function(L,i){
      h += '<article class="lesson"><div class="lesson-h"><span class="n">'+(i+1)+'</span><h2>'+esc(L.title)+'</h2><span class="when">'+esc(L.when)+'</span></div><div class="lesson-b">'+L.html;
      h += qHTML(L.check, 'ck|'+id+'|'+i, 'Check-in', 'instant');
      h += '</div></article>';
    });
    h += '<div class="quizbox"><h2>Section '+s.num+' quiz</h2><p class="muted">Five questions. Answers are checked as you go.</p>';
    s.quiz.forEach(function(q,i){ h += qHTML(q, 'qz|'+id+'|'+i, 'Question '+(i+1), 'instant'); });
    h += '<div class="score" id="qscore"></div></div>';
    h += '<div class="pager">';
    h += idx>0 ? '<button class="btn" data-go="'+SEC[idx-1].id+'">Back: '+esc(SEC[idx-1].title)+'</button>' : '<span></span>';
    h += idx<SEC.length-1 ? '<button class="btn primary" data-go="'+SEC[idx+1].id+'">Next: '+esc(SEC[idx+1].title)+'</button>' : '<button class="btn primary" data-go="cards">Go to flashcards</button>';
    h += '</div></div>';
    app.innerHTML = h;
    // restore answered
    Object.keys(state.answered).forEach(function(k){
      var box = app.querySelector('.q[data-qid="'+k+'"]');
      if (box) showInstant(box, findQ(k), state.answered[k]);
    });
    updateQuizScore(id);
  }
  function updateQuizScore(id){
    var s = byId[id], el = document.getElementById('qscore'); if (!el) return;
    var n=0, r=0;
    s.quiz.forEach(function(q,i){ var k='qz|'+id+'|'+i; if (k in state.answered){ n++; if (state.answered[k]===q.a) r++; } });
    el.textContent = n===s.quiz.length ? 'Score: '+r+' / '+n+(r===n?' — perfect.':' — reread the lessons for any you missed, then try the flashcards.') : '';
  }

  /* flashcards */
  function fcList(){
    var f = state.fc.filter;
    return D.cards.map(function(c,i){return i;}).filter(function(i){
      var c = D.cards[i];
      if (f==='all') return true;
      if (f==='key') return c.key;
      return c.sec===f;
    });
  }
  function fcReset(shuffle){
    var l = fcList();
    if (shuffle){ for (var i=l.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=l[i]; l[i]=l[j]; l[j]=t; } }
    state.fc.order = l; state.fc.i = 0;
  }
  function viewCards(){
    if (!state.fc.order.length) fcReset(false);
    var h = '<div class="sechead" data-color="#c9a45c"><div class="k">Flashcards</div><h1>Know every term four ways</h1><div class="src">Tap the card (or press space) to flip. Arrow keys move between cards.</div></div>';
    h += '<div class="fc-controls"><select id="fcfilter" aria-label="Choose cards"><option value="all">All cards ('+D.cards.length+')</option><option value="key">Study-guide key terms only (24)</option>';
    SEC.forEach(function(s){ h += '<option value="'+s.id+'">Section '+s.num+': '+esc(s.title)+'</option>'; });
    h += '</select><button class="btn" data-act="fc-shuffle">Shuffle</button></div><div id="fcwrap"></div>';
    app.innerHTML = h;
    document.getElementById('fcfilter').value = state.fc.filter;
    drawCard();
  }
  function drawCard(){
    var w = document.getElementById('fcwrap'); if (!w) return;
    var o = state.fc.order; if (!o.length){ w.innerHTML='<p>No cards in this set.</p>'; return; }
    var c = D.cards[o[state.fc.i]], s = byId[c.sec];
    var h = '<div class="card" id="card" data-color="'+s.color+'" tabindex="0" role="button" aria-label="Flip card"><div class="card-in">';
    h += '<div class="face front">'+(c.key?'<span class="badge">Key term</span>':'')+'<div class="term-t">'+esc(c.term)+'</div><div class="d">'+esc(c.date)+'</div><div class="s">Section '+s.num+': '+esc(s.title)+'</div><div class="hint">Tap to flip</div></div>';
    h += '<div class="face back"><h3>'+esc(c.term)+'</h3><div class="fgrid">';
    h += '<div><span class="h">Definition</span>'+esc(c.def)+'</div>';
    h += '<div><span class="h">Cause</span>'+esc(c.cause)+'</div>';
    h += '<div><span class="h">Effect</span>'+esc(c.effect)+'</div>';
    h += '<div><span class="h">Significance</span>'+esc(c.sig)+'</div>';
    h += '</div></div></div></div>';
    h += '<div class="fc-count">Card '+(state.fc.i+1)+' of '+o.length+'</div>';
    h += '<div class="fc-nav"><button class="btn" data-act="fc-prev">Previous</button><button class="btn" data-act="fc-flip">Flip</button><button class="btn primary" data-act="fc-next">Next</button></div>';
    w.innerHTML = h; applyColors(w);
  }

  /* tests */
  function viewTests(){
    var h = '<div class="sechead" data-color="#c9a45c"><div class="k">Practice tests</div><h1>Three 20-question tests</h1><div class="src">Multiple choice, like the real test. Answer everything, then submit to see your score by section.</div></div><div class="tests">';
    D.tests.forEach(function(t,i){
      h += '<button class="testcard" data-act="test-start" data-t="'+i+'"><div class="n">Test '+(i+1)+'</div><div>'+t.length+' questions covering all 7 sections</div></button>';
    });
    h += '</div>';
    app.innerHTML = h;
  }
  function viewTest(ti){
    var T = D.tests[ti];
    if (!state.test || state.test.t!==ti) state.test = {t:ti, picks:{}, done:false};
    var h = '<div class="sechead" data-color="#c9a45c"><div class="k">Practice test '+(ti+1)+'</div><h1>'+T.length+' questions</h1><div class="src">Pick one answer for each question, then submit.</div></div><div id="tres"></div>';
    T.forEach(function(q,i){
      var s = byId[q.s];
      h += '<div data-color="'+s.color+'">'+qHTML(q, 'ts|'+ti+'|'+i, 'Question '+(i+1)+'  (Section '+s.num+')', 'test')+'</div>';
    });
    h += '<div class="sticky-submit"><button class="btn primary" data-act="test-submit">Submit test</button></div>';
    h += '<div class="pager"><button class="btn" data-go="tests">All practice tests</button></div>';
    app.innerHTML = h;
    Object.keys(state.test.picks).forEach(function(i){
      var b = app.querySelector('.opt[data-qid="ts|'+ti+'|'+i+'"][data-i="'+state.test.picks[i]+'"]'); if (b) b.classList.add('sel');
    });
    if (state.test.done) gradeTest();
  }
  function gradeTest(){
    var ti = state.test.t, T = D.tests[ti], per = {}, right = 0;
    var unanswered = T.filter(function(q,i){ return !(i in state.test.picks); }).length;
    if (unanswered && !state.test.done){
      var ok = window.confirm(unanswered+' question'+(unanswered>1?'s are':' is')+' unanswered. Submit anyway?');
      if (!ok) return;
    }
    state.test.done = true;
    T.forEach(function(q,i){
      per[q.s] = per[q.s] || {r:0,n:0}; per[q.s].n++;
      var pick = state.test.picks[i], box = app.querySelector('.q[data-qid="ts|'+ti+'|'+i+'"]');
      if (pick===q.a){ right++; per[q.s].r++; }
      box.querySelectorAll('.opt').forEach(function(b,j){ b.disabled=true; b.classList.remove('sel'); if (j===q.a) b.classList.add('right'); else if (j===pick) b.classList.add('wrong'); });
      box.querySelector('.fbwrap').innerHTML = '<div class="fb '+(pick===q.a?'good':'bad')+'"><b>'+(pick===q.a?'Correct.':(pick===undefined?'Not answered — ':'Incorrect — ')+'the answer is '+LET[q.a]+'.')+'</b> '+esc(q.e)+'</div>';
    });
    var pct = Math.round(100*right/T.length);
    var h = '<div class="results"><div class="big">'+right+' / '+T.length+'</div><div>'+pct+'%. Tap a section below to review it.</div><div class="brk">';
    SEC.forEach(function(s){ if (per[s.id]) h += '<button data-go="'+s.id+'" data-color="'+s.color+'">Section '+s.num+': '+per[s.id].r+' / '+per[s.id].n+'<br><span class="muted">'+esc(s.title)+'</span></button>'; });
    h += '</div><div class="pager"><button class="btn" data-act="test-retry">Retake this test</button><button class="btn" data-go="tests">All practice tests</button></div></div>';
    var res = document.getElementById('tres'); res.innerHTML = h; applyColors(res);
    var sb = app.querySelector('.sticky-submit'); if (sb) sb.style.display='none';
    res.scrollIntoView({behavior:'smooth', block:'start'});
  }

  function go(v){
    state.view = v;
    if (v==='home') viewHome();
    else if (/^s\d$/.test(v)) viewSection(v);
    else if (v==='cards') viewCards();
    else if (v==='tests') viewTests();
    else if (v.indexOf('test')===0) viewTest(+v.slice(4));
    applyColors(app); renderSecbar(); setNav();
    window.scrollTo(0,0);
  }

  document.addEventListener('click', function(e){
    var g = e.target.closest('[data-go]');
    if (g){ go(g.getAttribute('data-go')); return; }
    var o = e.target.closest('.opt');
    if (o && !o.disabled){
      var id = o.getAttribute('data-qid'), i = +o.getAttribute('data-i');
      if (o.getAttribute('data-mode')==='instant'){
        if (id in state.answered) return;
        state.answered[id] = i;
        showInstant(o.closest('.q'), findQ(id), i);
        var p = id.split('|'); if (p[0]==='qz') updateQuizScore(p[1]);
      } else {
        var qi = +id.split('|')[2];
        state.test.picks[qi] = i;
        o.closest('.opts').querySelectorAll('.opt').forEach(function(b){ b.classList.remove('sel'); });
        o.classList.add('sel');
      }
      return;
    }
    var a = e.target.closest('[data-act]');
    if (a){
      var act = a.getAttribute('data-act');
      if (act==='fc-next'){ state.fc.i = (state.fc.i+1)%state.fc.order.length; drawCard(); }
      else if (act==='fc-prev'){ state.fc.i = (state.fc.i-1+state.fc.order.length)%state.fc.order.length; drawCard(); }
      else if (act==='fc-flip'){ var c=document.getElementById('card'); if (c) c.classList.toggle('flipped'); }
      else if (act==='fc-shuffle'){ fcReset(true); drawCard(); }
      else if (act==='test-start'){ state.test=null; go('test'+a.getAttribute('data-t')); }
      else if (act==='test-submit'){ gradeTest(); }
      else if (act==='test-retry'){ var t=state.test.t; state.test=null; go('test'+t); }
      return;
    }
    var card = e.target.closest('#card');
    if (card) card.classList.toggle('flipped');
  });
  document.addEventListener('change', function(e){
    if (e.target.id==='fcfilter'){ state.fc.filter = e.target.value; fcReset(false); drawCard(); }
  });
  document.addEventListener('keydown', function(e){
    if (state.view!=='cards' || e.target.tagName==='SELECT') return;
    if (e.key==='ArrowRight'){ state.fc.i=(state.fc.i+1)%state.fc.order.length; drawCard(); }
    else if (e.key==='ArrowLeft'){ state.fc.i=(state.fc.i-1+state.fc.order.length)%state.fc.order.length; drawCard(); }
    else if (e.key===' ' || e.key==='Enter'){ var c=document.getElementById('card'); if (c){ e.preventDefault(); c.classList.toggle('flipped'); } }
  });

  go('home');
})();
</script>
</body>
</html>
